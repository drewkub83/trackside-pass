# Fills in missing streets around tracks (tools/track-data/refresh_streets.py) on GitHub's servers, which reach the
# OpenStreetMap Overpass mirrors directly (a cloud Claude session's network was refused by them in Oct 2026).
# Run it by hand (Actions > Street maps > Run workflow) with the track ids. It commits the maps to the
# `streets-refresh` branch, NOT to main: look at them first, then merge that branch into main to deploy.
name: Street maps
on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Track ids, space separated (e.g. long-beach miami monaco)"
        required: true
permissions:
  contents: write
jobs:
  streets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh streets
        run: python3 tools/track-data/refresh_streets.py ${{ github.event.inputs.tracks }}
      - name: Check and commit to the streets-refresh branch
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "nothing changed"; exit 0; fi
          node tools/validate.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B streets-refresh
          git add data/maps
          git commit -m "Street maps: fill in missing streets (${{ github.event.inputs.tracks }}) [skip ci]"
          git push -f origin streets-refresh
