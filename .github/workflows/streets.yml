# Map fixes that need OpenStreetMap: missing streets (tools/track-data/refresh_streets.py) or the sea, lakes and rivers
# (tools/track-data/add_water.py), on GitHub's servers, which reach the
# OpenStreetMap Overpass mirrors directly (a cloud Claude session's network was refused by them in Oct 2026).
# Run it by hand (Actions > Street maps > Run workflow) with the track ids. It commits the maps to the
# `streets-refresh` branch, NOT to main: look at them first, then merge that branch into main to deploy.
name: Street maps
on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Track ids, space separated (e.g. long-beach miami monaco)"
        required: true
      tool:
        description: "streets = add missing streets (refresh_streets.py); water = add sea, lakes and rivers (add_water.py); fetch = download a NEW track's OpenStreetMap data (tracks = '<id> <lat> <lon> [radius]') to the osm-fetch branch"
        required: false
        default: streets
permissions:
  contents: write
jobs:
  streets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the map tool
        run: |
          if [ "${{ github.event.inputs.tool }}" = "fetch" ]; then
            set -- ${{ github.event.inputs.tracks }}
            python3 tools/track-data/fetch_track_osm.py "$@"
            python3 tools/track-data/osm_raceways.py "$2" "$3" "${4:-0.02}" | tee "tools/street-circuits/osm/$1-raceways.txt"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B osm-fetch
            git add -f "tools/street-circuits/osm/$1.json" "tools/street-circuits/osm/$1-raceways.txt"
            git commit -m "OpenStreetMap data for $1 [skip ci]"
            git push -f origin osm-fetch
            exit 0
          elif [ "${{ github.event.inputs.tool }}" = "probe" ]; then
            # save one public web page (tracks = its URL) to the osm-fetch branch, to see how a results/timing page gets its data
            mkdir -p probe && curl -sSL -m 60 -A "Mozilla/5.0 (Trackside Pass)" -o probe/page.html "${{ github.event.inputs.tracks }}" || true
            grep -oE '(https?:)?//[^"'"'"' )]+' probe/page.html | sort -u > probe/urls.txt || true
            for js in $(grep -oE 'src="[^"]+\.js[^"]*"' probe/page.html | sed 's/src="//;s/"$//' | head -15); do
              case "$js" in http*) u="$js";; //*) u="https:$js";; /*) u="$(echo "${{ github.event.inputs.tracks }}" | grep -oE '^https?://[^/]+')$js";; *) continue;; esac
              curl -sSL -m 60 "$u" | grep -oE '(wss?|https?)://[a-zA-Z0-9./_-]*(timing|live|result|api|socket)[a-zA-Z0-9./_?=&-]*' >> probe/endpoints.txt || true
            done
            sort -u -o probe/endpoints.txt probe/endpoints.txt 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B osm-fetch
            git add -f probe
            git commit -qm "Probe: ${{ github.event.inputs.tracks }} [skip ci]"
            git push -f origin osm-fetch
            exit 0
          elif [ "${{ github.event.inputs.tool }}" = "waterdata" ]; then
            # only download the raw OpenStreetMap water data (for checking add_water.py), to the osm-fetch branch
            for t in ${{ github.event.inputs.tracks }}; do python3 tools/track-data/add_water.py "$t" --dry; done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B osm-fetch
            git add -f tools/street-circuits/osm/*-water.json
            git commit -qm "OpenStreetMap water data: ${{ github.event.inputs.tracks }} [skip ci]"
            git push -f origin osm-fetch
            exit 0
          elif [ "${{ github.event.inputs.tool }}" = "water" ]; then
            # one track at a time, each saved to the water-refresh branch as soon as it is done, so a timeout loses nothing
            # (several runs can share the branch: each push rebases onto the others)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for t in ${{ github.event.inputs.tracks }}; do
              python3 tools/track-data/add_water.py "$t"
              if [ -n "$(git status --porcelain data)" ] && node tools/validate.js; then
                git add data/maps && git add -f "tools/street-circuits/osm/$t-water.json" && git commit -qm "Maps (water): $t [skip ci]"
                for i in 1 2 3 4 5; do git pull -q --rebase origin water-refresh && git push -q origin HEAD:water-refresh && break; sleep $((i*5)); done
              fi
              git checkout -q -- data
            done
            exit 0
          else python3 tools/track-data/refresh_streets.py ${{ github.event.inputs.tracks }}; fi
      - name: Check and commit to the streets-refresh branch
        if: github.event.inputs.tool != 'fetch' && github.event.inputs.tool != 'waterdata' && github.event.inputs.tool != 'probe'
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "nothing changed"; exit 0; fi
          node tools/validate.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B streets-refresh
          git add data/maps
          git commit -m "Maps (${{ github.event.inputs.tool }}): ${{ github.event.inputs.tracks }} [skip ci]"
          git push -f origin streets-refresh
