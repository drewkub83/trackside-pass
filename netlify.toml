# Netlify builds the app from the repo on every push: build.sh copies the live app files into dist/.
[build]
  command = "bash build.sh"
  publish = "dist"
  # Every production deploy costs 15 Netlify credits, so a push only deploys when its commit message contains [deploy]
  # (or when someone presses "Trigger deploy" in Netlify). Exit 0 = skip the build, exit 1 = build.
  ignore = '! git log -1 --pretty=%B | grep -qi "\\[deploy\\]"'

[functions]
  directory = "netlify/functions"

# The sideloadable Android app (downloads/TracksidePass.apk): served as an installer, never cached.
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=TracksidePass.apk"
    Cache-Control = "no-cache"
