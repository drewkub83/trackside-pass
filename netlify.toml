# Netlify builds the app from the repo on every push: build.sh copies the live app files into dist/.
[build]
  command = "bash build.sh"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The sideloadable Android app (downloads/TracksidePass.apk): served as an installer, never cached.
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=TracksidePass.apk"
    Cache-Control = "no-cache"
