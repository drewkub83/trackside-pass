# Keeps the data for live race weekends up to date with nobody's computer involved. Every 30 minutes Thu-Mon it runs
# tools/auto_update.py, which only acts inside a race weekend's window: refreshes the entry list, rebuilds the podium-game
# win chances once qualifying is published, imports the race classification and refreshes standings after the race. It also runs
# tools/indycar_update.py and tools/gtwca_update.py (IndyCar and GT World Challenge America results, standings and lap records).
# Anything it changes is committed to main, and Cloudflare deploys main. See the header of tools/auto_update.py.
name: Race weekend data
on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0,1"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the PDF reader (WEC entry lists)
        run: pip install --quiet pymupdf
      - name: Update race weekend data
        run: python3 tools/auto_update.py
      - name: Check, commit and push
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "nothing changed"; exit 0; fi
          node tools/validate.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Race weekend data: automatic update [deploy]"
          git pull --rebase origin main
          git push origin main
      - name: Publish the games to Supabase (picks lock, banking and scoring happen there)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tools/sync_games.mjs
